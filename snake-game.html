<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Classic Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        :root {
            --primary: #0f0;
            --secondary: #ff0;
            --accent: #f00;
            --dark: #111;
            --grid: #222;
            --snake-head: #0f0;
            --snake-body: #0a0;
            --food: #f00;
        }

        .game-container {
            position: relative;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--secondary);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto 20px;
            padding: 0 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        #score {
            color: var(--secondary);
        }

        #high-score {
            color: var(--accent);
        }

        canvas {
            background: var(--dark);
            border: 4px solid var(--grid);
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 100%;
            max-height: 80vh;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 25px;
        }

        .controls p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .arrow-keys {
            display: inline-block;
        }

        .key {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: var(--dark);
            border: 2px solid var(--grid);
            color: #fff;
            line-height: 36px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 2px;
            border-radius: 4px;
            box-shadow: 0 4px 0 #000;
        }

        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 2.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--accent);
        }

        .overlay p {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            margin-top: 30px;
            gap: 15px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            justify-content: center;
        }

        .d-btn {
            width: 70px;
            height: 70px;
            background: var(--dark);
            border: 2px solid var(--grid);
            border-radius: 10px;
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .d-btn:active {
            background: var(--grid);
        }

        .empty {
            visibility: hidden;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: block;
            }

            .controls {
                display: none;
            }

            canvas {
                border-width: 2px;
            }

            .game-stats {
                font-size: 0.8rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>SNAKE</h1>
        <div class="subtitle">USE ARROW KEYS TO MOVE &bull; EAT FOOD TO GROW</div>

        <div class="game-stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="high-score">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <p>CONTROLS:</p>
            <div class="arrow-keys">
                <span class="key" style="grid-area: up;">^</span>
                <span class="key" style="grid-area: left;">&lt;</span>
                <span class="key" style="grid-area: down;">v</span>
                <span class="key" style="grid-area: right;">&gt;</span>
            </div>
        </div>

        <div class="mobile-controls">
            <div class="d-pad">
                <div class="empty"></div>
                <div class="d-btn" id="btn-up">&#9650;</div>
                <div class="empty"></div>
                <div class="d-btn" id="btn-left">&#9664;</div>
                <div class="d-btn" id="btn-down">&#9660;</div>
                <div class="d-btn" id="btn-right">&#9654;</div>
            </div>
        </div>

        <div class="overlay" id="gameOver">
            <h2>GAME OVER</h2>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverOverlay = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restart-btn');

        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let gameSpeed = 150;
        let gameInterval;

        // Game state
        let snake = [];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let highScore = 0;
        let gameRunning = false;
        let gameOver = false;

        // Initialize
        function init() {
            highScore = localStorage.getItem('snakeHighScore') || 0;
            highScoreEl.textContent = highScore;
            startGame();
        }

        function startGame() {
            snake = [
                {x: 10, y: 10},
                {x: 10, y: 11},
                {x: 10, y: 12}
            ];
            dx = 0;
            dy = -1;
            nextDx = 0;
            nextDy = -1;
            score = 0;
            gameRunning = true;
            gameOver = false;
            scoreEl.textContent = score;
            gameOverOverlay.classList.remove('visible');
            placeFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Make sure food doesn't spawn on snake
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                    return;
                }
            }
        }

        function gameLoop() {
            if (!gameRunning || gameOver) return;

            dx = nextDx;
            dy = nextDy;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOverGame();
                return;
            }

            // Check self collision
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    gameOverGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
                // Speed up slightly
                if (gameSpeed > 80) {
                    clearInterval(gameInterval);
                    gameSpeed -= 2;
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (subtle)
            ctx.strokeStyle = '#0a0a0a';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 15;
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;

            // Draw snake
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#0f0';
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = '#0a0';
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function gameOverGame() {
            gameRunning = false;
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.add('visible');
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && !gameOver) return;

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    break;
            }
        });

        // Restart button
        restartBtn.addEventListener('click', () => {
            startGame();
        });

        // Mobile controls
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        btnUp.addEventListener('click', () => {
            if (dy === 0) { nextDx = 0; nextDy = -1; }
        });
        btnDown.addEventListener('click', () => {
            if (dy === 0) { nextDx = 0; nextDy = 1; }
        });
        btnLeft.addEventListener('click', () => {
            if (dx === 0) { nextDx = -1; nextDy = 0; }
        });
        btnRight.addEventListener('click', () => {
            if (dx === 0) { nextDx = 1; nextDy = 0; }
        });

        // Touch support
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    if (dx > 0 && this.dx === 0) { nextDx = 1; nextDy = 0; }
                    if (dx < 0 && this.dx === 0) { nextDx = -1; nextDy = 0; }
                }
            } else {
                if (Math.abs(dy) > 30) {
                    if (dy > 0 && this.dy === 0) { nextDx = 0; nextDy = 1; }
                    if (dy < 0 && this.dy === 0) { nextDx = 0; nextDy = -1; }
                }
            }
        }, {passive: false});

        // Initialize
        init();
    </script>
</body>
</html>
